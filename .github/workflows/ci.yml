name: Check

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assessing-software-architecture-quality
    steps:
      - uses: actions/checkout@v4
        with:
          # Package validation requires this folder name to match SKILL.md `name`.
          # The GitHub repository name can differ.
          path: assessing-software-architecture-quality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Validate, test, and digest
        run: |
          python3 scripts/architecture_quality.py validate-package .
          python3 scripts/architecture_quality.py sync-model-docs . --check
          python3 scripts/validate_schemas.py
          python3 -m unittest discover -s tests/unit -p 'test_*.py' -v
          python3 scripts/package_digest.py .
